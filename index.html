  <style>
    /* Permanent career shortcut; outside the animated app shell so it stays fixed. */
    .wh-home-fab {
      display:none; position:fixed; z-index:40;
      right:max(18px,env(safe-area-inset-right));
      bottom:max(18px,env(safe-area-inset-bottom));
      width:64px; height:64px; padding:6px; border-radius:50%;
      border:2px solid var(--club-accent,#c8fa5b);
      background:#101b29; cursor:pointer; align-items:center; justify-content:center;
      box-shadow:0 8px 24px #0008,0 0 15px color-mix(in srgb,var(--club-accent,#c8fa5b) 35%,transparent);
      transition:transform .2s ease,box-shadow .2s ease;
      -webkit-tap-highlight-color:transparent;
    }
    #app:has(.app-shell) + .wh-home-fab {display:flex}
    body.modal-open .wh-home-fab {visibility:hidden;pointer-events:none}
    .wh-home-fab svg {display:block;width:100%;height:100%;transition:transform .28s ease}
    @media(hover:hover){.wh-home-fab:hover{transform:translateY(-4px) scale(1.06)}.wh-home-fab:hover svg{transform:rotate(22deg)}}
    .wh-home-fab:active{transform:scale(.92)}
    .wh-home-fab:focus-visible{outline:3px solid white;outline-offset:4px}
    .app-shell .footer{padding-bottom:90px}
    @media(max-width:650px){.wh-home-fab{width:58px;height:58px;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom))}}
    @media(prefers-reduced-motion:reduce){.wh-home-fab,.wh-home-fab svg{transition:none}}
  </style>

      <circle cx="24" cy="24" r="21" fill="url(#wh-home-ball-fill)" stroke="#552b17" stroke-width="2"/>
